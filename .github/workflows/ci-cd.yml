name: CI/CD

on:
  push:
    branches: [main]      # déclenché à chaque push sur main
  workflow_dispatch:      # ajoute aussi un bouton "Run workflow" dans l'onglet Actions

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/house-api:latest
  CONTAINER_NAME: nch   # ← remplace xx par tes initiales
  HOST_PORT: "9000"              # ← ton port sur la VM

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

  cd:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Déployer sur la VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            docker pull ${{ env.IMAGE }}
            docker rm -f ${{ env.CONTAINER_NAME }} || true
            docker run -d --name ${{ env.CONTAINER_NAME }} -p ${{ env.HOST_PORT }}:8000 ${{ env.IMAGE }}